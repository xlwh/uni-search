linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gocritic
linters-settings:
  errcheck:
    check-type-assertions: true
  gocritic:
    enabled-tags:
      - diagnostic
      - performance
issues:
  exclude-rules:
    - path: _test\.go
      linters: [errcheck, gocritic]
    - path: internal/raft/
      linters: [gocritic]
  max-issues-per-linter: 0
  max-same-issues: 0
